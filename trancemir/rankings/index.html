<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TranceMir — Rankings</title>
    <link rel="icon" href="/trancemir/favicon.svg" type="image/svg+xml">

    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #070A12;
            color: #EAF0FF;
        }

        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 56px 20px;
        }

        .card {
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 18px;
            padding: 28px;
        }

        .top {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .online-count {
            flex: 1;
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            color: #62e995;
            text-shadow: 0 0 10px rgba(53, 208, 111, .35);
            white-space: nowrap;
        }

        .online-count-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            margin-right: 8px;
            border-radius: 50%;
            background: #35d06f;
            box-shadow: 0 0 8px rgba(53, 208, 111, .8);
        }

        .btn {
            display: inline-block;
            padding: 10px 14px;
            border-radius: 14px;
            text-decoration: none;
            color: #EAF0FF;
            border: 1px solid rgba(255,255,255,.16);
            background: rgba(255,255,255,.06);
        }

            .btn:hover {
                background: rgba(255,255,255,.10);
            }

        h1 {
            margin: 0 0 6px;
            font-size: 34px;
        }

        p {
            margin: 0 0 14px;
            line-height: 1.6;
            color: rgba(234,240,255,.85);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin: 10px 0 18px;
        }

        .tab {
            padding: 10px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.04);
            color: #EAF0FF;
            cursor: pointer;
            font: inherit;
            font-size: 14px;
            user-select: none;
        }

            .tab:hover {
                background: rgba(255,255,255,.07);
            }

            .tab.active {
                background: rgba(255,255,255,.10);
            }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
            border-radius: 14px;
        }

        table {
            width: 100%;
            min-width: 720px;
            border-collapse: collapse;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.10);
            background: rgba(255,255,255,.03);
        }

        th,
        td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            white-space: nowrap;
        }

        th {
            font-size: 13px;
            color: rgba(234,240,255,.70);
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: rgba(255,255,255,.025);
        }

        .message-cell {
            text-align: center;
            color: rgba(234,240,255,.72);
            padding: 24px;
        }

        .note {
            margin-top: 14px;
            font-size: 14px;
            color: rgba(234,240,255,.70);
        }

            .note.error {
                color: #FFB3B3;
            }


        .player-name {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #35d06f;
            box-shadow: 0 0 6px rgba(53, 208, 111, .75);
            flex: 0 0 auto;
        }

            .online-dot.offline {
                visibility: hidden;
                box-shadow: none;
            }

        @media (max-width: 600px) {
            .wrap {
                padding: 28px 12px;
            }

            .card {
                padding: 18px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="card">
            <div class="top">
                <div>
                    <h1>Rankings</h1>
                    <p>Top players and guilds.</p>
                </div>

                <div class="online-count" id="onlineCount">
                    <span class="online-count-dot"></span>
                    Online Players: —
                </div>

                <a class="btn" href="/trancemir/">← Back to Home</a>
            </div>

            <div class="tabs" id="tabs" role="tablist">
                <button type="button"
                        class="tab active"
                        data-view="players"
                        role="tab"
                        aria-selected="true">
                    Players
                </button>

                <button type="button"
                        class="tab"
                        data-view="guilds"
                        role="tab"
                        aria-selected="false">
                    Guilds
                </button>
            </div>

            <div class="table-wrap">
                <table>
                    <thead id="thead"></thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>

            <div class="note" id="status">
                Loading rankings...
            </div>
        </div>
    </div>

    <script>
        const API_URL =
            "https://mirapi.trancegames.com/?Type=Rankings";

        const REFRESH_INTERVAL_MS = 60 * 1000;

        const tabs = document.getElementById("tabs");
        const thead = document.getElementById("thead");
        const tbody = document.getElementById("tbody");
        const status = document.getElementById("status");
        const onlineCount = document.getElementById("onlineCount");

        let currentView = "players";

        let rankings = {
            updatedAt: null,
            onlinePlayers: 0,
            players: [],
            guilds: []
        };

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function formatNumber(value) {
            const number = Number(value);

            if (!Number.isFinite(number))
                return "0";

            return number.toLocaleString();
        }

        function updateOnlineCount() {
            onlineCount.innerHTML = `
            <span class="online-count-dot"></span>
            Online Players: ${formatNumber(rankings.onlinePlayers)}
            `;
        }

        function showLoading() {
            status.classList.remove("error");
            status.textContent = "Loading rankings...";

            if (currentView === "guilds") {
                renderGuildHeaders();

                tbody.innerHTML = `
                  <tr>
                    <td class="message-cell" colspan="5">
                      Loading guild rankings...
                    </td>
                  </tr>
                `;
            } else {
                renderPlayerHeaders();

                tbody.innerHTML = `
                  <tr>
                    <td class="message-cell" colspan="6">
                      Loading player rankings...
                    </td>
                  </tr>
                `;
            }
        }

        function renderPlayerHeaders() {
            thead.innerHTML = `
                <tr>
                  <th style="width:80px;">Rank</th>
                  <th>Name</th>
                  <th style="width:120px;">Class</th>
                  <th style="width:100px;">Rebirth</th>
                  <th style="width:100px;">Level</th>
                  <th>Guild</th>
                </tr>
              `;
        }

        function renderGuildHeaders() {
            thead.innerHTML = `
                <tr>
                  <th style="width:80px;">Rank</th>
                  <th>Guild Name</th>
                  <th style="width:100px;">Level</th>
                  <th style="width:160px;">Points</th>
                  <th style="width:110px;">Members</th>
                </tr>
              `;
        }

        function renderPlayers() {
            renderPlayerHeaders();

            if (!rankings.players.length) {
                tbody.innerHTML = `
                  <tr>
                    <td class="message-cell" colspan="6">
                      No player rankings available.
                    </td>
                  </tr>
                `;

                return;
            }

            tbody.innerHTML = rankings.players.map(player => `
                <tr>
                  <td>${formatNumber(player.rank)}</td>
                  <td>
                    <span class="player-name">
              <span
                    class="online-dot ${player.online ? '' : 'offline'}"
                    title="${player.online ? 'Online' : ''}"
                    aria-label="${player.online ? 'Online' : 'Offline'}">
                </span>
                <span>${escapeHtml(player.name)}</span>
              </span>
                  </td>
                  <td>${escapeHtml(player.class)}</td>
                  <td>${formatNumber(player.rebirth)}</td>
                  <td>${formatNumber(player.level)}</td>
                  <td>${escapeHtml(player.guild || "—")}</td>
                </tr>
              `).join("");
        }

        function renderGuilds() {
            renderGuildHeaders();

            if (!rankings.guilds.length) {
                tbody.innerHTML = `
                  <tr>
                    <td class="message-cell" colspan="5">
                      No guild rankings available.
                    </td>
                  </tr>
                `;

                return;
            }

            tbody.innerHTML = rankings.guilds.map(guild => `
                <tr>
                  <td>${formatNumber(guild.rank)}</td>
                  <td>${escapeHtml(guild.name)}</td>
                  <td>${formatNumber(guild.level)}</td>
                  <td>${formatNumber(guild.points)}</td>
                  <td>${formatNumber(guild.members)}</td>
                </tr>
              `).join("");
        }

        function updateStatus() {
            status.classList.remove("error");

            if (!rankings.updatedAt) {
                status.textContent = "Rankings are currently unavailable.";
                return;
            }

            const updatedAt = new Date(rankings.updatedAt);

            if (Number.isNaN(updatedAt.getTime())) {
                status.textContent = "Rankings loaded.";
                return;
            }

            status.textContent =
                `Last updated: ${updatedAt.toLocaleString()}`;
        }

        function renderCurrentView() {
            if (currentView === "guilds")
                renderGuilds();
            else
                renderPlayers();

            updateOnlineCount();
            updateStatus();
        }

        async function loadRankings(showInitialLoading = false) {
            if (showInitialLoading)
                showLoading();

            try {
                const response = await fetch(API_URL, {
                    method: "GET",
                    cache: "no-store",
                    headers: {
                        "Accept": "application/json"
                    }
                });

                if (!response.ok) {
                    throw new Error(
                        `Rankings request failed with status ${response.status}`
                    );
                }

                const data = await response.json();

                rankings = {
                    updatedAt: data.updatedAt ?? null,
                    onlinePlayers: Number.isFinite(Number(data.onlinePlayers))
                        ? Number(data.onlinePlayers)
                        : 0,
                    players: Array.isArray(data.players)
                        ? data.players
                        : [],
                    guilds: Array.isArray(data.guilds)
                        ? data.guilds
                        : []
                };

                renderCurrentView();
            } catch (error) {
                console.error("Unable to load rankings:", error);

                status.classList.add("error");
                status.textContent =
                    "Unable to load rankings from the game server.";

                if (
                    rankings.players.length === 0 &&
                    rankings.guilds.length === 0
                ) {
                    if (currentView === "guilds") {
                        renderGuildHeaders();

                        tbody.innerHTML = `
                      <tr>
                        <td class="message-cell" colspan="5">
                          Rankings are temporarily unavailable.
                        </td>
                      </tr>
                    `;
                    } else {
                        renderPlayerHeaders();

                        tbody.innerHTML = `
                      <tr>
                        <td class="message-cell" colspan="6">
                          Rankings are temporarily unavailable.
                        </td>
                      </tr>
                    `;
                    }
                }
            }
        }

        tabs.addEventListener("click", event => {
            const tab = event.target.closest(".tab");

            if (!tab)
                return;

            document.querySelectorAll(".tab").forEach(item => {
                item.classList.remove("active");
                item.setAttribute("aria-selected", "false");
            });

            tab.classList.add("active");
            tab.setAttribute("aria-selected", "true");

            currentView = tab.dataset.view;

            renderCurrentView();
        });

        loadRankings(true);

        setInterval(() => {
            loadRankings(false);
        }, REFRESH_INTERVAL_MS);
    </script>
</body>
</html>
